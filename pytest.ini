[pytest]
# Pytest configuration for multi-agents-ocp-builds

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore specific directories during test collection
norecursedirs = .git .tox dist build *.egg

# Warnings
filterwarnings =
    ignore::DeprecationWarning:dashboard.heartbeat

# Output options
addopts = -v --tb=short
